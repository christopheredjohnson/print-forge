[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/dataset",
    "crates/engine",
    "crates/pdf",
    "crates/template",
    "crates/validation",
]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
barcoders = { version = "2.0.0", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
lopdf = { version = "0.44.0", default-features = false }
printpdf = { version = "0.12.5", features = ["jpeg", "png", "svg"] }
qrcodegen = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ttf-parser = "0.25.1"

print-forge-dataset = { path = "crates/dataset" }
print-forge-engine = { path = "crates/engine" }
print-forge-pdf = { path = "crates/pdf" }
print-forge-template = { path = "crates/template" }
print-forge-validation = { path = "crates/validation" }

[workspace.lints.rust]
unsafe_code = "forbid"
