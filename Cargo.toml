[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/studio",
    "crates/dataset",
    "crates/engine",
    "crates/pdf",
    "crates/template",
    "crates/validation",
]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
barcoders = { version = "2.0.0", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lopdf = { version = "0.44.0", default-features = false }
pdf-core-14-font-afms = "0.1.1"
printpdf = { version = "0.12.5", features = ["jpeg", "png", "svg"] }
qrcodegen = "1.8.0"
resvg = "0.45.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ttf-parser = "0.25.1"

print-forge-dataset = { path = "crates/dataset" }
print-forge-engine = { path = "crates/engine" }
print-forge-pdf = { path = "crates/pdf" }
print-forge-template = { path = "crates/template" }
print-forge-validation = { path = "crates/validation" }

[workspace.lints.rust]
unsafe_code = "forbid"
